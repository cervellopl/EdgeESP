; EdgeESP - ESP32-S3 bike computer
; Display: MCUFRIEND 3.6" 480x320 TFTLCD shield (16-bit 8080 parallel)
; GPS: u-blox NEO-M8N / M9N / M10 over UART (UBX binary)

[env:edge_s3]
platform      = espressif32@^6.9.0
board         = esp32-s3-devkitc-1
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

board_build.partitions   = partitions.csv
board_build.flash_mode   = qio
board_build.arduino.memory_type = qio_qspi   ; keeps GPIO33..37 free for the LCD bus

build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -I src
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1      ; console on native USB, frees GPIO43/44 for I2C
  -DCORE_DEBUG_LEVEL=1
  -DLGFX_USE_V1
  -DBOARD_HAS_PSRAM
  ; Panel controller. Read it once with the boot-time ID dump, then pin it here.
  ; PANEL_ILI9486 | PANEL_ILI9481 | PANEL_R61581 | PANEL_HX8357B
  -DPANEL_ILI9486

lib_deps =
  lovyan03/LovyanGFX@^1.1.16
  h2zero/NimBLE-Arduino@^1.4.2
  adafruit/Adafruit BME280 Library@^2.2.4
  adafruit/Adafruit Unified Sensor@^1.1.14

lib_ldf_mode = deep+
